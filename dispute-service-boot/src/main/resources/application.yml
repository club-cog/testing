# Defaults match the legacy dispute-service; every value can be overridden with an env var.
spring:
  application:
    name: dispute-service
  profiles:
    default: h2
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  main:
    banner-mode: off

server:
  # -Dport=... still works, as in the legacy EmbeddedServer
  port: ${port:${PORT:9083}}
  shutdown: graceful

creditfile:
  url: ${CREDITFILE_URL:http://localhost:8081}
  timeout-ms: ${CREDITFILE_TIMEOUT_MS:5000}
score:
  url: ${SCORE_URL:http://localhost:8082}
  timeout-ms: ${SCORE_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
