# Postgres / Cloud SQL. On GKE DB_HOST is 127.0.0.1 when the Cloud SQL Auth Proxy sidecar is used.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ukcredit}}
    username: ${DB_USER:ukcredit}
    password: ${DB_PASSWORD:ukcredit}
