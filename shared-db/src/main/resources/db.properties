# Default: local H2 file database (PostgreSQL compatibility mode) shared by all services.
# Override with -Djdbc.url=... (see scripts/env-postgres.sh)
jdbc.driverClassName=org.h2.Driver
jdbc.url=jdbc:h2:file:./data/h2/ukcredit;MODE=PostgreSQL;AUTO_SERVER=TRUE
jdbc.username=ukcredit
jdbc.password=ukcredit
jdbc.pool.maxActive=10
