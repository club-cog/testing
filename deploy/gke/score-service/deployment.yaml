apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-service
  labels:
    app.kubernetes.io/name: score-service
    app.kubernetes.io/part-of: uk-credit-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: score-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: score-service
        app.kubernetes.io/part-of: uk-credit-platform
    spec:
      serviceAccountName: score-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: score-service
          image: REGION-docker.pkg.dev/PROJECT_ID/uk-credit/score-service-boot:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9082
          envFrom:
            - configMapRef:
                name: score-service-config
            - secretRef:
                name: score-service-db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Optional: Cloud SQL Auth Proxy sidecar (uncomment and use DB_URL jdbc:postgresql://127.0.0.1:5432/ukcredit).
        # Needs Workload Identity on the score-service KSA bound to a GSA with roles/cloudsql.client.
        # - name: cloud-sql-proxy
        #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
        #   args:
        #     - "--private-ip"
        #     - "--port=5432"
        #     - "--health-check"
        #     - "--http-address=0.0.0.0"
        #     - "PROJECT_ID:REGION:INSTANCE_NAME"
        #   securityContext:
        #     runAsNonRoot: true
        #     allowPrivilegeEscalation: false
        #     readOnlyRootFilesystem: true
        #     capabilities:
        #       drop: ["ALL"]
        #   resources:
        #     requests:
        #       cpu: 50m
        #       memory: 64Mi
        #   startupProbe:
        #     httpGet:
        #       path: /startup
        #       port: 9090
        #     periodSeconds: 1
        #     failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}
