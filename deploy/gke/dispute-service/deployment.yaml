apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispute-service
  labels:
    app.kubernetes.io/name: dispute-service
    app.kubernetes.io/part-of: uk-credit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: dispute-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispute-service
        app.kubernetes.io/part-of: uk-credit
    spec:
      # Bind to a GCP service account with roles/cloudsql.client via Workload Identity when using the proxy.
      serviceAccountName: dispute-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispute-service
          image: REGION-docker.pkg.dev/PROJECT_ID/uk-credit/dispute-service-boot:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9083
          envFrom:
            - configMapRef:
                name: dispute-service-config
            - secretRef:
                name: dispute-service-db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Optional Cloud SQL Auth Proxy sidecar (native sidecar, GKE >= 1.29 move it to initContainers
        # with restartPolicy: Always if preferred). Uncomment and set the instance connection name.
        # - name: cloud-sql-proxy
        #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
        #   args:
        #     - "--private-ip"
        #     - "--structured-logs"
        #     - "--port=5432"
        #     - "--health-check"
        #     - "--http-address=0.0.0.0"
        #     - "PROJECT_ID:REGION:INSTANCE_NAME"
        #   securityContext:
        #     runAsNonRoot: true
        #     allowPrivilegeEscalation: false
        #     readOnlyRootFilesystem: true
        #     capabilities:
        #       drop: ["ALL"]
        #   resources:
        #     requests:
        #       cpu: 50m
        #       memory: 64Mi
        #   livenessProbe:
        #     httpGet:
        #       path: /liveness
        #       port: 9090
        #   readinessProbe:
        #     httpGet:
        #       path: /readiness
        #       port: 9090
      volumes:
        - name: tmp
          emptyDir: {}
